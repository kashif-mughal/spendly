<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>House Expense Manager</title>
<meta name="description" content="Personal house expense manager - transactions, accounts, templates, budgets and reports.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23146c5a'/%3E%3Cpath d='M16 6 5 15h3v11h6v-7h4v7h6V15h3z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="boot" class="boot">
  <div class="boot-card">
    <div class="spinner" aria-hidden="true"></div>
    <p>Loading your data…</p>
  </div>
</div>

<header class="topbar">
  <button class="icon-btn nav-toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>
  <a class="brand" href="#/dashboard">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7"/><path d="M16 6 5 15h3v11h6v-7h4v7h6V15h3z"/></svg>
    <span>House Expense Manager</span>
  </a>
  <div class="topbar-spacer"></div>
  <div class="period-picker" id="periodPicker">
    <label class="field compact">
      <span>Year</span>
      <select id="globalYear"></select>
    </label>
    <label class="field compact">
      <span>Month</span>
      <select id="globalMonth"></select>
    </label>
  </div>
  <button class="icon-btn" id="themeToggle" aria-label="Toggle dark mode" title="Toggle dark mode">
    <svg viewBox="0 0 24 24" aria-hidden="true" class="icon-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg viewBox="0 0 24 24" aria-hidden="true" class="icon-moon"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
  <span class="save-state" id="saveState" role="status" aria-live="polite"></span>
</header>

<div class="shell">
  <nav class="sidebar" id="sidebar" aria-label="Main">
    <p class="nav-group">Daily use</p>
    <a href="#/dashboard" data-route="dashboard"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 9h8V3h-8z"/></svg>Dashboard</a>
    <a href="#/transactions" data-route="transactions"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h13l-3-3M21 17H8l3 3"/></svg>Transactions</a>
    <a href="#/accounts" data-route="accounts"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10h18M3 10 12 4l9 6M5 10v9h14v-9M3 19h18"/></svg>Accounts</a>
    <a href="#/templates" data-route="templates"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v7H4zM13 4h7v4h-7zM13 10h7v10h-7zM4 13h7v7H4z"/></svg>Templates</a>
    <a href="#/budget" data-route="budget"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M14 3.3A9 9 0 0 1 20.7 10H14z"/></svg>Budget</a>

    <p class="nav-group">Reports</p>
    <a href="#/monthly-report" data-route="monthly-report"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Monthly Report</a>
    <a href="#/category-report" data-route="category-report"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h12M3 18h7"/></svg>Category Report</a>
    <a href="#/account-report" data-route="account-report"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17 9 11l4 4 8-8"/><path d="M21 7v5h-5"/></svg>Account Report</a>

    <p class="nav-group">Setup</p>
    <a href="#/categories" data-route="categories"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16M4 12h16M4 19h16"/><circle cx="8" cy="5" r="1.6"/><circle cx="14" cy="12" r="1.6"/><circle cx="10" cy="19" r="1.6"/></svg>Categories</a>
    <a href="#/lists" data-route="lists"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Lists</a>
    <a href="#/data" data-route="data"><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>Data &amp; Backup</a>
    <a href="#/help" data-route="help"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.3 2.4c-.6.2-.8.7-.8 1.3v.4"/><path d="M12 17h.01"/></svg>How To Use</a>
  </nav>

  <main id="view" class="view" tabindex="-1"></main>
</div>

<div class="nav-scrim" id="navScrim" hidden></div>
<div class="toast-stack" id="toastStack" aria-live="polite"></div>
<div class="modal-root" id="modalRoot" hidden></div>

<script src="data/seed.js"></script>
<script src="js/util.js"></script>
<script src="js/store.js"></script>
<script src="js/calc.js"></script>
<script src="js/charts.js"></script>
<script src="js/ui.js"></script>
<script src="js/views/dashboard.js"></script>
<script src="js/views/transactions.js"></script>
<script src="js/views/accounts.js"></script>
<script src="js/views/templates.js"></script>
<script src="js/views/budget.js"></script>
<script src="js/views/monthly-report.js"></script>
<script src="js/views/category-report.js"></script>
<script src="js/views/account-report.js"></script>
<script src="js/views/categories.js"></script>
<script src="js/views/lists.js"></script>
<script src="js/views/data.js"></script>
<script src="js/views/help.js"></script>
<script src="js/app.js"></script>
</body>
</html>
